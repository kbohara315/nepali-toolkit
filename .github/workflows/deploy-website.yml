name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/nepali-toolkit/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter nepali-toolkit build
      - run: pnpm --filter @nepali-toolkit/website typecheck
      - run: pnpm --filter @nepali-toolkit/website test
      - name: Set Pages URL
        id: pages-config
        shell: bash
        run: |
          if [[ "${GITHUB_REPOSITORY#*/}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm --filter @nepali-toolkit/website build
        env:
          SITE_BASE: ${{ steps.pages-config.outputs.base }}
          SITE_URL: ${{ steps.pages-config.outputs.url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
